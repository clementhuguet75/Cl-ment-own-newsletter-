name: Republish corrected intelligence journal (no API cost)
# 2026-11-08: deploy the ISW ChatGPT weekly edition to Feeder
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visuals.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: intelligence-pages
  cancel-in-progress: false
jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
