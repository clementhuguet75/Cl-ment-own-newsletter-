name: Publish weekly intelligence digest
# On-demand pilot: preserve factual citations across final editorial revisions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/curate.yml'
  schedule:
    - cron: '30 17 * * 0'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: intelligence-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Check API secret
        id: api_key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::OPENAI_API_KEY missing; cannot write the journal"
            exit 1
          fi
      - name: Research and write one weekly article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1
        run: python weekly.py
      - name: Save issue and archive in repository
        run: |
          git config user.name "intelligence-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Publish weekly geopolitical digest"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
